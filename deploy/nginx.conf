# Behind Nginx Proxy Manager, which terminates TLS for vtt.tatanga.eu.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Maps and music go up through /api (music: 40 MB).
    client_max_body_size 64m;

    # Nginx Proxy Manager passes responses through as they come, so text is
    # compressed here (the JS bundle: 2 MB raw). Images are compressed already.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json
               image/svg+xml application/wasm;

    # Docker DNS + a variable upstream: nginx resolves `server` per request, so
    # a restarted server container with a new IP does not leave us on 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vtt_server http://server:3001;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /api/     { proxy_pass $vtt_server; proxy_read_timeout 300s; }
    location /uploads/ { proxy_pass $vtt_server; }
    location /public/  { proxy_pass $vtt_server; }

    location /socket.io/ {
        proxy_pass $vtt_server;
        proxy_http_version 1.1;
        # A location with its own proxy_set_header drops the inherited ones.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Hashed Vite assets never change; index.html must always be fresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
