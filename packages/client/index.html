<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Every first screen (loading, login, join) stands on the poster; without
         this the 1.8 MB download waits until the JS bundle has run. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/art/login-poster.webp"
      fetchpriority="high"
    />
    <title>VTT — Cyberpunk RED</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
